theme = "PaperMod"
baseURL = 'https://OgalogJP.github.io/'
locale = 'ja-jp'
title = 'Eila Game Lab'

[params]
  env = "production"
  description = "ゲーム制作・Mod制作・技術メモ"
  defaultTheme = "dark"
  showCover = true
  disableSpecial1stPost = true
  showToc = true
  ShowLastMod = true
  enableGitInfo = true
  
  [params.profileMode]
  enabled = true
  title = "Eira Dev Notes"
  subtitle = "ゲーム制作・技術ブログ"
  imageUrl = "images/profile.png"
  imageWidth = 120
  imageHeight = 120
  imageTitle = "Eira"
  
  [[params.profileMode.buttons]]
  name = "記事一覧"
  url = "/posts/"

  [[params.profileMode.buttons]]
  name = "Game Dev"
  url = "/tags/gamedev/"

  [[params.profileMode.buttons]]
  name = "Misc"
  url = "/tags/misc/"
    
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

    [markup.tableOfContents]
      endLevel = 3
      startLevel = 2

[menu]
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 1

  [[menu.main]]
    name = "Game Dev"
    url = "/tags/GameDev/"
    weight = 2

  [[menu.main]]
    name = "Misc"
    url = "/tags/Misc/"
    weight = 3

  [[menu.main]]
    name = "Privacy policy"
    url = "/privacy/"
    weight = 4

  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 5


